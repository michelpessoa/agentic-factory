[project]
name = "fabrica-agentica"
version = "0.1.0"
description = "Orquestrador local que coloca agentes de IA no fluxo de desenvolvimento"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fabrica", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: exige Docker e as imagens da fábrica",
  "claude: exige o token da fábrica e consome o limite do plano",
]
addopts = "-m 'not docker and not claude'"

[tool.ruff]
line-length = 100
